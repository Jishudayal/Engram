name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install --upgrade pip ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev,qdrant,chroma,pgvector,langchain,llm]"
      - run: pytest tests/ --cov=engram --cov-report=term-missing

  test-memoryeval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install --upgrade pip
      - run: pip install -e "."
      - run: pip install -e "memoryeval/[dev]"
      - run: python -c "import memoryeval; print(memoryeval.__version__)"
      - run: memoryeval --version

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev,qdrant,chroma,pgvector,langchain,llm]"
      - run: mypy engram/
