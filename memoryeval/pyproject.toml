[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memoryeval"
version = "0.1.0-alpha"
description = "Benchmark suite for measuring AI memory system reliability"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "memory", "benchmark", "evaluation", "rag", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
memoryeval = "memoryeval.cli:main"

[project.urls]
Homepage = "https://github.com/engram-ai/engram"
Repository = "https://github.com/engram-ai/engram"
Issues = "https://github.com/engram-ai/engram/issues"

[tool.hatch.build.targets.wheel]
packages = ["memoryeval"]
