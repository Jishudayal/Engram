[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engram"
version = "0.1.0-alpha"
description = "Memory traces you can trust — the open-source memory reliability layer for production AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["ai", "memory", "agents", "llm", "rag", "reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9"]
chroma = ["chromadb>=0.5"]
weaviate = ["weaviate-client>=4.0"]
pgvector = ["asyncpg>=0.29", "pgvector>=0.3"]
llm = ["anthropic>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "anthropic>=0.30",
]
all = [
    "engram[qdrant,chroma,weaviate,pgvector,llm]",
]

[project.urls]
Homepage = "https://github.com/engram-ai/engram"
Repository = "https://github.com/engram-ai/engram"
Issues = "https://github.com/engram-ai/engram/issues"

[tool.hatch.build.targets.wheel]
packages = ["engram"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "memoryeval/src"]
